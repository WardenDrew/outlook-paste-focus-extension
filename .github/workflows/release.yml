name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Package release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release and build extension package
        run: |
          if [ "$RELEASE_NAME" != "$RELEASE_TAG" ]; then
            echo "Release name and tag must match and use vN.N.N format." >&2
            exit 1
          fi
          node scripts/package.mjs "$RELEASE_TAG"
      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" "dist/outlook-paste-focus-${RELEASE_TAG#v}.zip" --clobber
