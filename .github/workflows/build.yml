name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build extension package
        run: node scripts/package.mjs
